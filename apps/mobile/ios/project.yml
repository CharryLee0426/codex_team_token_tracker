name: CodexTracker
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios.git
    exactVersion: 1.5.2
  ClerkConvex:
    url: https://github.com/clerk/clerk-convex-swift.git
    exactVersion: 0.1.0
  Convex:
    url: https://github.com/get-convex/convex-swift.git
    exactVersion: 0.8.1
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CodexTracker:
    type: application
    platform: iOS
    sources:
      - path: CodexTracker
      - path: ../fixtures/dashboard-demo.json
        buildPhase: resources
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: ClerkConvex
        product: ClerkConvex
      - package: Convex
        product: ConvexMobile
    info:
      path: CodexTracker/Info.plist
      properties:
        CFBundleDisplayName: Codex Tracker
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CLERK_PUBLISHABLE_KEY: $(CLERK_PUBLISHABLE_KEY)
        CONVEX_URL: $(CONVEX_URL)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenli.codextracker
        PRODUCT_NAME: CodexTracker
        GENERATE_INFOPLIST_FILE: NO
  CodexTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CodexTrackerTests]
    dependencies:
      - target: CodexTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenli.codextracker.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CodexTracker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CodexTracker
        BUNDLE_LOADER: $(TEST_HOST)
  CodexTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CodexTrackerUITests]
    dependencies:
      - target: CodexTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenli.codextracker.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CodexTracker
schemes:
  CodexTracker:
    build:
      targets:
        CodexTracker: all
        CodexTrackerTests: [test]
        CodexTrackerUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - CodexTrackerTests
        - CodexTrackerUITests
