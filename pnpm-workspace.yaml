packages:
  - "apps/*"
  - "packages/*"

# pnpm >= 10 blocks dependency lifecycle scripts unless allow-listed here
allowBuilds:
  esbuild: true
  electron: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  "@clerk/shared": true
  core-js: true
  "@parcel/watcher": true
  "@swc/core": true

# pnpm 11 supply-chain policy: these pinned versions were published recently and are explicitly allowed
minimumReleaseAgeExclude:
  - "@next/env@15.5.25"
  - "@next/swc-darwin-arm64@15.5.25"
  - "@next/swc-darwin-x64@15.5.25"
  - "@next/swc-linux-arm64-gnu@15.5.25"
  - "@next/swc-linux-arm64-musl@15.5.25"
  - "@next/swc-linux-x64-gnu@15.5.25"
  - "@next/swc-linux-x64-musl@15.5.25"
  - "@next/swc-win32-arm64-msvc@15.5.25"
  - "@next/swc-win32-x64-msvc@15.5.25"
  - "lucide-react@1.38.0"
  - "next@15.5.25"
